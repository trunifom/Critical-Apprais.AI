name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the run of the superseded commit on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,import,cli]"
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,import,cli]"
      # Live tests call real LLM APIs and cost money: never in CI. tests/data_large is not versioned,
      # so tests that need it skip themselves.
      # -ra lists every failed/skipped test at the end, --tb=short keeps the log readable.
      - run: python -m pytest -q -ra --tb=short -m "not live"
