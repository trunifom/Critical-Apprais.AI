    Die offiziellen PRISMA-Zahlen werden im Lauf selbst festgehalten.

estimate:
  header: "Geschätzte Tokens und Kosten (Vorschau)"
  input_tokens: "Eingabe-Tokens"
  output_tokens: "Ausgabe-Tokens"
  total_tokens: "Tokens insgesamt"
