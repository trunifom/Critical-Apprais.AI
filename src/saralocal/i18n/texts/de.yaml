sections:
  page:
    title: "Automatisierte Literaturübersicht – Einrichtung"
    subtitle: "Erfassen Sie Projektangaben, legen Sie die Screening-Kriterien fest, laden Sie Ihre Quellen hoch und starten Sie den Lauf."

  project:
    header: "1️⃣ Projektangaben"
    fields:
      title:
        label: "Projekttitel"
        placeholder: "z. B. Systematische Übersicht zu Neurofeedback bei Kindern mit ADHS"
        help: |
          **ℹ️ Projekttitel**
          Geben Sie Ihrer Übersicht einen kurzen, eindeutigen Namen.
          Er erscheint in Protokollen und exportierten Berichten.
      description:
        label: "Projektbeschreibung (optional)"
        placeholder: "Beschreiben Sie kurz Ziel, Umfang und Hintergrund dieser Übersicht …"
        help: |
          **ℹ️ Projektbeschreibung**
          Fügen Sie optional eine kurze Beschreibung von Studiendesign, Zielen und Umfang hinzu.
          Diese Angaben werden mit dem Projekt gespeichert und in Protokolle und Exporte übernommen.

  screening:
    header: "2️⃣ Screening-Kriterien festlegen"

    review_mode:
      label: "Modus wählen"
      options: ["Abstract"]
      help: |
        **ℹ️ Modus**
        Version 1 bewertet **Titel und Abstracts**. Das Screening von Volltexten ist noch nicht verfügbar.

    objectives:
      count_label: "Anzahl Ziele"
      count_help: |
        **ℹ️ Forschungsziele**
        Wie viele Ziele leiten das Screening?
        Geben Sie einen Wert zwischen **1** und **10** ein.
        Jedes Ziel kann ein kurzer Satz sein (durch Kommas getrennte Teilpunkte sind in Ordnung).
      list_header: "Ziele"
      item_label: "Ziel {index}"

    framework:
      label: "Rahmenwerk wählen"
      options: ["PICOS", "SPIDER", "PECO", "PIRD", "CUSTOM"]
      help: |
        **ℹ️ Rahmenwerk**
        Wählen Sie ein Standard-Rahmenwerk, um Ihre Ein- und Ausschlusskriterien zu gliedern, oder **CUSTOM** für eigene Felder.

        **Verfügbare Rahmenwerke**
        - **PICOS**: *Population*, *Intervention*, *Comparison*, *Outcome*, *Study Design*
        - **SPIDER**: *Sample*, *Phenomenon of Interest*, *Design*, *Evaluation*, *Research Type*
        - **PECO**: *Population*, *Exposure*, *Comparison*, *Outcome*
        - **PIRD**: *Population*, *Index Test*, *Reference Standard*, *Diagnosis*
        - **CUSTOM**: Eigene Felder für Ein- und Ausschluss festlegen

    frameworks_info: |
      **📚 Verfügbare Rahmenwerke**
      - **PICOS**: Population, Intervention, Comparison, Outcome, Study Design
      - **SPIDER**: Sample, Phenomenon of Interest, Design, Evaluation, Research Type
      - **PECO**: Population, Exposure, Comparison, Outcome
      - **PIRD**: Population, Index Test, Reference Standard, Diagnosis
      - **CUSTOM**: Eigene Ein- und Ausschlussfelder festlegen

    custom_criteria:
      subheader: "🔧 Eigene Kriterien"
      field_name_label: "Name des eigenen Felds"
      add_button: "Feld hinzufügen"
      remove_button: "Entfernen"

    inclusion_exclusion:
      subheader: "Ein- und Ausschlusskriterien"
      inclusion_label: "Einschluss – {field}"
      exclusion_label: "Ausschluss – {field}"

  upload:
    abstract:
      header: "3️⃣ Quelldateien hochladen und benennen"
      instructions: |
        Laden Sie eine oder mehrere bibliografische Exportdateien hoch.
        Unterstützte Formate: **.ris**, **.bib**, **.nbib** (PubMed/MEDLINE), **.csv** und **.xlsx**.

        Geben Sie für jede Datei den **Namen der Datenbank oder Quelle** an (z. B. *PubMed*, *MEDLINE*, *Embase*, *CINAHL*).
        Dieser Name erscheint in Ihren Protokollen und hilft Ihnen, die Datensätze später zuzuordnen.
      file_type:
        label: "Dateityp wählen"
        options: [".ris", ".bib", ".nbib", ".csv", ".xlsx"]
      file_uploader:
        label: "Dateien auswählen"
      database_names_header: "**Datenbank- oder Quellenname für jede hochgeladene Datei:**"
      database_field:
        label: "**Datenbank- oder Quellenname** für `{filename}` eingeben"
        placeholder: "z. B. PubMed, MEDLINE, Embase, CINAHL"
        help: |
          **ℹ️ Datenbank- oder Quellenname**
          Geben Sie den Namen der wissenschaftlichen Datenbank oder Exportquelle ein, aus der die Datei stammt.
          Es ist ein freier Text; Beispiele:
          - *PubMed*
          - *MEDLINE*
          - *Embase*
          - *CINAHL*
          - *Cochrane Library*
          - *PsycINFO*
          - *ERIC*
          - *Scopus*
          - *Web of Science*
          - *Google Scholar*

  start:
    confirm_label: "Ich bestätige, dass Projektangaben, Kriterien und Dateien stimmen. Lauf starten."
    button_label: "🚀 Lauf starten"
    total_records_preview: "**Datensätze insgesamt: {count}. Vorschau:**"

