# Fehlertexte: Was ist passiert – Warum – Was können Sie tun (Plan Kap. 26.4, ADR 0012).
errors:
  E101:
    title: "Der Dateityp wird nicht unterstützt oder wurde nicht erkannt."
    cause: "Der Inhalt ist weder RIS, NBIB, BibTeX noch eine Tabelle, oder der Dateityp gehört nicht zu Version 1."
    action: "Exportieren Sie die Suchergebnisse erneut als RIS, NBIB, BibTeX, CSV oder XLSX."
  E102:
    title: "In der Datei wurden keine Datensätze gefunden."
    cause: "Die Datei ist leer oder nicht der Export, den Sie meinten."
    action: "Prüfen Sie, ob der Export leer ist, und exportieren Sie ihn erneut."
  E103:
    title: "Die Datei konnte mit dieser Zeichenkodierung nicht gelesen werden."
    cause: "Die Datei verwendet eine Zeichenkodierung, die das Programm nicht erwartet hat."
    action: "Versuchen Sie eine andere Kodierung, zum Beispiel --encoding cp1252."
  E104:
    title: "Eine Spalte konnte nicht zugeordnet werden."
    cause: "Die Spaltennamen der Tabelle weichen von den üblichen Namen ab."
    action: "Nennen Sie die Spalte selbst, zum Beispiel --map abstract=<spalte>."
  E105:
    title: "Die ZIP-Datei enthält keine lesbaren PDFs."
    cause: "Der PDF-Import gehört nicht zu Version 1."
    action: "Importieren Sie stattdessen einen bibliografischen Export."
  E106:
    title: "Diese Datei wurde bereits importiert."
    cause: "Eine Datei mit identischem Inhalt steht im Import-Protokoll."
    action: "Mit --force importieren Sie sie erneut; die Datensätze sind dann doppelt vorhanden."
  E201:
    title: "In der project.yaml fehlt eine Pflichtangabe."
    cause: "Die Projektdatei ist unvollständig, zum Beispiel ohne Einschlusskriterien."
    action: "Ergänzen Sie die fehlende Angabe in der project.yaml."
  E202:
    title: "Das Modell ist nicht bekannt."
    cause: "Der Modellname steht nicht im Modellkatalog."
    action: "Prüfen Sie den Modellnamen oder ergänzen Sie die models.yaml."
  E203:
    title: "Eine Angabe hat einen ungültigen Wert."
    cause: "Ein Wert liegt ausserhalb des erlaubten Bereichs, oder ein Einstellungsname ist falsch geschrieben."
    action: "Korrigieren Sie die aufgeführten Angaben."
  E301:
    title: "Der API-Schlüssel fehlt oder ist ungültig."
    cause: "Die Umgebungsvariable mit dem Schlüssel ist nicht gesetzt, oder der Anbieter hat den Schlüssel abgelehnt."
    action: "Setzen Sie die in der project.yaml genannte Umgebungsvariable und versuchen Sie es erneut."
  E302:
    title: "Das Aufruflimit des Anbieters wurde überschritten."
    cause: "Zu viele Aufrufe pro Minute."
    action: "Das Programm bremst automatisch. Senken Sie die Zahl paralleler Aufrufe, wenn das oft vorkommt."
  E303:
    title: "Die Eingabe ist für das Modell zu lang."
    cause: "Titel und Abstract zusammen überschreiten das Kontextfenster des Modells."
    action: "Wählen Sie ein Modell mit grösserem Kontextfenster."
  E304:
    title: "Die Antwort des Modells war unbrauchbar."
    cause: "Die Antwort hielt das verlangte Format nicht ein."
    action: "Der Aufruf wird wiederholt. Kommt das oft vor, wählen Sie ein anderes Modell. Unbrauchbare Antworten zählen nie als Entscheidung."
  E305:
    title: "Der Anbieter war nicht erreichbar."
    cause: "Netzwerk- oder Proxyproblem oder ein vorübergehender Fehler beim Anbieter."
    action: "Prüfen Sie die Verbindung und setzen Sie den Lauf fort."
  E306:
