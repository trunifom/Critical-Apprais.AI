start:
  title: "Critical Apprais.AI"
  tagline: "Screening-Assistent für systematische Übersichtsarbeiten – läuft lokal auf Ihrem Rechner"
  purpose: |
    Critical Apprais.AI unterstützt das **Screening von Titeln und Abstracts** einer systematischen Übersichtsarbeit.
    Das Programm liest Ihre Literaturexporte, schickt jeden Datensatz mit Ihren Ein- und Ausschlusskriterien an ein
    Sprachmodell und hält einen **Vorschlag** (Einschluss, Ausschluss oder unsicher) mit kurzer Begründung je Kriterium fest.
  how_it_works:
    header: "So funktioniert es"
    step1: "Beschreiben Sie Ihre Übersicht und Ihre Kriterien."
    step2: "Importieren Sie Ihre Suchergebnisse (RIS, NBIB, BibTeX, CSV, XLSX)."
    step3: "Prüfen Sie die Schätzung, machen Sie einen kleinen Probelauf und starten Sie den Lauf."
    step4: "Prüfen Sie die Vorschläge in der Ergebnistabelle und exportieren Sie sie."
  limits:
    header: "Grenzen"
    text: |
      Das Werkzeug **ersetzt keine Menschen**. Es schlägt vor, Sie entscheiden. Version 1 arbeitet nur mit Titeln und Abstracts.
      Datensätze ohne Abstract werden vom Modell nicht bewertet, bleiben aber in der Tabelle sichtbar.
      Nur die Aufrufe an den Modellanbieter verlassen Ihren Rechner; alle Dateien bleiben im Projektordner.
  open_project: "Projekt öffnen"
  recent: "Zuletzt verwendet"
  browse: "Ordner durchsuchen …"
  new_project: "Neues Projekt"
  folder_label: "Projektordner"
  template_label: "Vorlage"
  create_button: "Projekt anlegen"
  demo_hint: "Probieren Sie die Demo-Vorlage aus, um zu sehen, wie ein Projekt aussieht."

