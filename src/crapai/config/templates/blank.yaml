# Critical Apprais.AI project file (schema version 1). Edit it before screening.
# Reference: docs/PROJEKTPLAN.md chapter 16. NEVER put an API key in this file;
# only the NAME of the environment variable (llm.api_key_env) belongs here.
schema: 1

project:
  title: "__TITLE__"
  description: ""
  language: en            # de | en (interface and report language)
  mode: abstract          # title/abstract screening (version 1)

objectives: []            # the review questions, one per line

criteria:
  framework: PICOS        # PICOS | SPIDER | PECO | PIRD | CUSTOM
  custom_fields: []       # only for CUSTOM
  inclusion:              # REQUIRED before screening: at least one inclusion criterion
    Population: ""
    Intervention: ""
    Comparison: ""
    Outcome: ""
    Study Design: ""
  exclusion: {}

dedup:
  strategy: doi_or_title
  min_title_words: 4        # shorter titles ("Editorial", "Erratum") never match by title alone; 1 = off
  reporting_mode: all_before_screening

screening:
  uncertain_policy: include   # sensitivity first: unclear records are kept for human review

llm:
  provider: openai
  model: "gpt-4o-mini"        # check the model name against your provider's list
  api_key_env: OPENAI_API_KEY # NAME of the environment variable that holds the key

# Optional: remember how the columns of a table file are assigned, so the import can be repeated
# without --map. Key = file name, value = internal column: header in the file.
# import:
#   mappings:
#     export.csv:
#       title: Name
#       abstract: Zusammenfassung

limits:
  max_cost: 10.0              # in the currency below; null = no limit
  currency: USD
  seconds_per_request: 3.0               # assumed time of one request (duration estimate only)
  cost_uncertainty: 0.15                 # half width of the cost band (0.15 = plus/minus 15 %)

# How a screening run is organised and protected (crapai screen). All values are settings.
run:
  batch_size: 1000                 # records per batch ("package"); checked on disk after each batch
  max_batch_error_rate: 0.5        # pause if more than this share of a batch failed (0 to 1)
  max_consecutive_errors: 20       # pause after this many failed records in a row (0 = off)
  retry_failed_on_resume: true     # try records that failed before again when a run is resumed
  checkpoint_seconds: 2            # how often the progress file is saved during a batch
  heartbeat_seconds: 10            # how often the project lock shows that the run is alive
  stop_grace_seconds: 10           # after a stop request: time for running requests to finish
  sample_seed: 42                  # seed of --sample (the same records are drawn again)
  retry_base_delay_s: 1            # first wait before a repeat (doubles each time)
  retry_max_delay_s: 60            # longest single wait
  max_retry_time_s: 600            # longest total wait on a rate limit before a record fails

# Thresholds of the abstract-quality hint (it never excludes a record).
quality:
  long_word_letters: 40            # a longer single word looks glued together
  short_abstract_words: 40         # fewer words than this: 'short'
  garbled_mean_word_letters: 9.0   # mean word length above this looks garbled
  min_words_for_mean: 30
  short_abstract_chars_unspaced: 120  # like short_abstract_words for Chinese, Japanese, Korean, Thai

# Thresholds of 'crapai check'.
preflight:
  min_abstract_ratio: 0.60         # a source with a smaller share of abstracts gets a warning
