    setting:
      dedup_strategy: "Wonach Duplikate erkannt werden. «doi_or_title»: gleiche DOI oder gleicher Titel (empfohlen); «strict_ids»: nur gleiche DOI/PMID; «title»: nur Titel; «title_authors»: Titel und Autor:innen."
      dedup_min_title_words: "Sehr kurze Titel (zum Beispiel «Editorial») wären sonst oft falsche Treffer. Beispiel: 4 heisst, dass ein Titel mit weniger als 4 Wörtern nie allein über den Titel als Duplikat gilt."
      dedup_fuzzy_enabled: "Findet auch Titel mit kleinen Unterschieden (Tippfehler, Satzzeichen, Gross-/Kleinschreibung). Bei Treffern prüfen Jahr, DOI und Autor:in zusätzlich."
      dedup_fuzzy_threshold: "Wie ähnlich zwei Titel mindestens sein müssen. 1 = identisch, 0,94 ist ein vorsichtiger Wert. Höher = weniger, aber sicherere Treffer."
      dedup_fuzzy_max_year_difference: "Gleiche Titel mit weiter auseinanderliegendem Erscheinungsjahr gelten nicht als Duplikat. Beispiel: 1 erlaubt 2019 und 2020 (Online- und Printjahr)."
      dedup_fuzzy_require_author_agreement: "Ist das gesetzt, müssen auch die ersten Autor:innen übereinstimmen. Sicherer, findet aber weniger."
      dedup_reporting_mode: "Wie Duplikate im PRISMA-Diagramm erscheinen: alle vor dem Screening entfernt, oder nur die zwischen Datenbanken."
      prefilters_language_allow: "Sprachen, die bewertet werden, als Sprachcodes mit Komma getrennt. Beispiel: eng, ger. Leer bedeutet: keine Einschränkung."
      prefilters_exclude_retracted: "Zurückgezogene Publikationen vor dem Screening ausschliessen. Sie bleiben in der Tabelle sichtbar."
      prefilters_keywords_include_any: "Ein Datensatz wird ausgeschlossen, ausser mindestens eines dieser Stichwörter kommt in Titel, Abstract oder Keywords vor. Durch Komma getrennt. Leer bedeutet: keine Vorgabe."
      prefilters_keywords_exclude_any: "Ein Datensatz wird ausgeschlossen, wenn eines dieser Stichwörter in Titel, Abstract oder Keywords vorkommt. Durch Komma getrennt. Leer bedeutet: kein Filter. Läuft vor dem Modell, ohne Kosten."
      quality_short_abstract_words: "Ein Abstract mit weniger Wörtern bekommt den Hinweis «kurz» (ein Hinweis, kein Ausschluss). 40 Wörter sind etwa drei Sätze."
      quality_long_word_letters: "Ein einzelnes Wort mit mehr Buchstaben sieht zusammengeklebt aus (Exportfehler). 40 ist für deutsche Wörter grosszügig."
      quality_garbled_mean_word_letters: "Liegt die mittlere Wortlänge darüber, sieht der Text kaputt aus (zum Beispiel ohne Leerzeichen). Normaler Text hat etwa 5 bis 7."
      quality_min_words_for_mean: "Erst ab dieser Zahl Wörter wird die mittlere Wortlänge beurteilt; kürzere Texte schwanken zu stark."
      quality_short_abstract_chars_unspaced: "Wie «kurz», aber in Zeichen, für Schriften ohne Leerzeichen (Chinesisch, Japanisch, Koreanisch, Thai)."
      preflight_min_abstract_ratio: "Hat eine Quelle weniger Datensätze mit Abstract als diesen Anteil, erscheint eine Warnung. 0,6 bedeutet 60 %."
      screening_include_title_only: "Auch Datensätze ohne Abstract bewerten, nur anhand des Titels. Weniger zuverlässig, aber nichts fällt weg."
      screening_include_keywords_in_prompt: "Das Modell sieht zusätzlich die Stichwörter des Datensatzes (nicht nur Titel und Abstract). Schliesst dadurch allein nichts aus; für einen harten Schnitt den Stichwort-Vorfilter dazu einsetzen."
      discussion_max_rounds: "„crapai discuss“ lässt die ursprünglichen Modelle zweier oder mehrerer verglichener Läufe einen Datensatz, bei dem sie uneinig waren, nochmals überdenken; jedes sieht die Entscheidung und Begründung der anderen. So viele Runden werden versucht, bevor die Entscheidungsregel greift. Mehr Runden kosten mehr, ohne Garantie auf Annäherung."
      discussion_tie_break: "„majority“: Die Entscheidung, auf die sich die meisten Modelle festlegen, gewinnt (ein echtes Patt, z. B. 1 zu 1, gilt weiterhin als kein Konsens). „no_consensus“: nie einen Sieger küren, auch bei klarer Mehrheit; der Datensatz wird als NO_CONSENSUS markiert, zur Entscheidung durch Sie."
      screening_uncertain_policy: "Wie «unsicher» später gezählt wird: als Einschluss (nichts geht verloren), als Ausschluss oder getrennt."
      screening_decision_source: "«model»: die Entscheidung kommt vom Modell; «rule»: sie wird aus den Einzelurteilen abgeleitet."
      screening_reasoning_language: "Sprache, in der das Modell seine Begründung schreibt (de oder en)."
      llm_provider: "Anbieter des Sprachmodells: «openai_compatible» für SwissGPT und ähnliche Dienste, «openai» für OpenAI, «mock» zum kostenlosen Ausprobieren ohne Netz."
      llm_model: "Name des Modells beim Anbieter. Beispiel: gpt-4o-mini. Bei «mock» wählt der Name das Testszenario (S1 bis S15)."
      llm_base_url: "Adresse des Dienstes, nur für «openai_compatible». Beispiel: https://api.prod.alpineai.ch/v1"
      llm_api_key_env: "NAME der Umgebungsvariable, die den Schlüssel enthält, zum Beispiel SWISSGPT_API_KEY. Hier wird nie der Schlüssel selbst eingetragen."
