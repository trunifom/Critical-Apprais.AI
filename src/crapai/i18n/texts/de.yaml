  disclaimer: "Die Ergebnisse sind Vorschläge. Jede Entscheidung muss von Menschen geprüft werden."
  language: "Sprache"
  navigation: "Schritte"
  close_project: "Projekt schliessen"
  intro:
    title: "ℹ️ Über diese Seite: Ziel, Ablauf und Ergebnis"
    label:
      goal: "Ziel"
      what: "Was passiert"
      how: "So gehen Sie vor"
      result: "Ergebnis"
    start:
      goal: "Ein Projekt öffnen oder neu anlegen. Ein Projekt ist ein Ordner auf Ihrem Computer, der alle Daten Ihres Reviews enthält."
      what: "Es wird nichts gesendet. Beim Anlegen entsteht ein Ordner mit einer Projektdatei (project.yaml); beim Öffnen wird er nur gelesen."
      how: "Zuletzt benutzte Projekte stehen links zum Anklicken. Für ein neues Projekt geben Sie einen Ordnerpfad und einen Titel ein und wählen eine Vorlage («demo» enthält Beispielkriterien)."
      result: "Das Projekt ist geöffnet. Weiter geht es mit der Übersicht oder direkt mit Schritt 1."
    overview:
      goal: "Auf einen Blick sehen, welche Schritte erledigt sind, wo etwas fehlt und was als Nächstes zu tun ist."
      what: "Die Seite liest den Stand Ihres Projekts (Beschreibung, Daten, Prüfung, Screening, Export) und ändert nichts."
      how: "Lesen Sie von oben nach unten. Der Knopf «Weiter mit …» führt zum nächsten offenen Schritt; mit «Öffnen» springen Sie zu jedem Schritt."
      result: "Sie wissen, wie weit das Projekt ist und welcher Schritt fehlt."
    project:
      goal: "Beschreiben, worum es in Ihrem Review geht: Projektbeschrieb, Forschungsfrage und die Ein- und Ausschlusskriterien."
      what: "Das Sprachmodell bekommt genau diese Angaben als Aufgabe. Je klarer sie sind, desto besser sind die Vorschläge. Gespeichert wird in project.overrides.yaml; Ihre project.yaml bleibt unverändert."
      how: "1. Name und Beschreibung eintragen. 2. Forschungsfragen eintragen (eine pro Zeile). 3. Rahmenwerk wählen (PICOS, SPIDER …) und für jedes Element schreiben, was eingeschlossen und was ausgeschlossen wird. 4. Speichern."
      result: "Das Projekt ist beschrieben; Schritt 1 gilt als erledigt, sobald mindestens ein Einschlusskriterium steht."
    data:
      goal: "Die Treffer Ihrer Literatursuche in das Projekt einlesen."
      what: "Dateien aus Datenbanken (PubMed, Embase, Web of Science …) werden gelesen und als Datensätze gespeichert. Die Originaldatei bleibt unverändert im Ordner sources/. Vorab sehen Sie eine Trockenlesung; erst «Importieren» speichert."
      how: "1. Dateien wählen (RIS, BibTeX, NBIB, CSV, Excel). 2. Jeder Datei einen Quellennamen geben, zum Beispiel «PubMed». 3. Importieren. Mehrere Datenbanken importieren Sie nacheinander oder gemeinsam."
      result: "Die Datensätze stehen in der Tabelle unten; die Liste «Bereits importierte Dateien» zeigt, was wann eingelesen wurde."
    check:
      goal: "Die Daten aufräumen und vor dem Lauf abschätzen, was er kostet und wie lange er dauert."
      what: "Doppelte Datensätze, unerwünschte Sprachen und Jahre sowie Datensätze ohne Abstract werden markiert, nie gelöscht. Danach werden Tokens, Kosten und Dauer geschätzt."
      how: "Auf «Prüfung ausführen» klicken und den Bericht lesen. Die Zahl «gehen ans Modell» zeigt, wie viele Datensätze bewertet würden."
      result: "Ein Bericht mit Gründen je Datensatz und eine Kostenschätzung. Mit dieser Zahl entscheiden Sie, ob Sie den Lauf starten."
    run:
      goal: "Die Datensätze vom Sprachmodell bewerten lassen: einschliessen, ausschliessen oder unsicher, jeweils mit Begründung."
      what: "Titel und Abstracts werden an den eingestellten Anbieter gesendet und in Päckchen verarbeitet. Der Lauf arbeitet in einem eigenen Prozess; nichts geht bei einem Abbruch verloren und er lässt sich fortsetzen."
      how: "Zuerst ein Probelauf mit 20 Datensätzen, dann der volle Lauf. Einverständnis ankreuzen, «Lauf starten». Der Balken zeigt den Fortschritt; «Pausieren» und «Stoppen» sind jederzeit möglich."
      result: "Für jeden Datensatz ein Vorschlag. Die Vorschläge ersetzen Ihre Entscheidung nicht: Menschen prüfen jede Entscheidung."
    flow:
      goal: "Die Zahlen für das PRISMA-Flussdiagramm: wie viele Datensätze gefunden, entfernt, geprüft und ausgeschlossen wurden."
      what: "Die Zahlen werden aus den Ereignissen des Projekts abgeleitet (Import, Duplikate, Filter, Screening). Nichts wird von Hand eingetragen."
      how: "Wählen Sie, wie Duplikate gezählt werden, und lesen Sie die Zahlen ab. Warnungen weisen auf veraltete Schritte hin."
