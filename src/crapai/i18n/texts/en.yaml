        tpm: "tokens per minute"
        latency: "the time a request takes"
        none: "nothing to send"
      over_limit: "The worst case is above limits.max_cost ({max_cost}); the run would stop early."
      error: "The cost estimate is not available: {problem}"
  dedup:
    done: "Duplicates marked: {marked} of {records} records in {groups} group(s). Strategy: {strategy} ({source}). Nothing was deleted."
    none: "No duplicates found with strategy {strategy} ({source})."
    methods: "By reason: {methods}"
    sources: "Within one source: {within}. Across sources: {across}."
    source:
      cli: "command line"
      project: "project.yaml"
      default: "default"
  status:
    title: "Project: {title}"
    folder: "Folder: {path}"
    records: "Records: {records} (with abstract: {abstracts}, empty: {empty}, duplicates: {duplicates})"
    sources: "Sources:"
