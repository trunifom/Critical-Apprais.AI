  close_project: "Close project"
  intro:
    title: "ℹ️ About this page: goal, procedure and result"
    label:
      goal: "Goal"
      what: "What happens"
      how: "How to proceed"
      result: "Result"
    start:
      goal: "Open a project or create a new one. A project is a folder on your computer that holds all data of your review."
      what: "Nothing is sent. Creating makes a folder with a project file (project.yaml); opening only reads it."
      how: "Recently used projects are listed on the left to click. For a new project enter a folder path and a title and choose a template (\"demo\" contains example criteria)."
      result: "The project is open. Continue with the overview or directly with step 1."
    overview:
      goal: "See at a glance which steps are done, where something is missing and what to do next."
      what: "The page reads the state of your project (description, data, check, screening, export) and changes nothing."
      how: "Read from top to bottom. The button \"Continue with ...\" leads to the next open step; \"Open\" jumps to any step."
      result: "You know how far the project is and which step is missing."
    project:
      goal: "Describe what your review is about: project description, research question and the inclusion and exclusion criteria."
      what: "The language model gets exactly these statements as its task. The clearer they are, the better the suggestions. They are saved in project.overrides.yaml; your project.yaml stays unchanged."
      how: "1. Enter name and description. 2. Enter the research questions (one per line). 3. Choose a framework (PICOS, SPIDER ...) and write for each element what is included and what is excluded. 4. Save."
      result: "The project is described; step 1 counts as done as soon as at least one inclusion criterion is set."
    data:
      goal: "Read the hits of your literature search into the project."
      what: "Files from databases (PubMed, Embase, Web of Science ...) are read and stored as records. The original file stays unchanged in the folder sources/. You see a dry read first; only \"Import\" saves."
      how: "1. Choose files (RIS, BibTeX, NBIB, CSV, Excel). 2. Give each file a source name, for example \"PubMed\". 3. Import. Import several databases one after the other or together."
      result: "The records appear in the table below; the list \"Files already imported\" shows what was read and when."
    check:
      goal: "Tidy up the data and estimate before the run what it costs and how long it takes."
      what: "Duplicate records, unwanted languages and years and records without an abstract are marked, never deleted. Then tokens, cost and duration are estimated."
      how: "Click \"Run the check\" and read the report. The number \"Go to the model\" shows how many records would be assessed."
      result: "A report with reasons per record and a cost estimate. Use it to decide whether to start the run."
    run:
      goal: "Let the language model assess the records: include, exclude or uncertain, each with a reason."
      what: "Titles and abstracts are sent to the configured provider and processed in batches. The run works in its own process; nothing is lost if it stops and it can be resumed."
      how: "First a trial run with 20 records, then the full run. Tick the consent box, \"Start the run\". The bar shows progress; \"Pause\" and \"Stop\" are possible at any time."
      result: "A suggestion for every record. Suggestions do not replace your decision: humans review every decision."
    flow:
      goal: "The numbers for the PRISMA flow diagram: how many records were found, removed, screened and excluded."
      what: "The numbers are derived from the events of the project (import, duplicates, filters, screening). Nothing is typed in by hand."
      how: "Choose how duplicates are counted and read off the numbers. Warnings point to outdated steps."
      result: "The numbers for your methods section. As a file you get them on the page \"Export results\"."
    export:
      goal: "Hand data out of the project as a file: for Excel, a reference manager or the later evaluation."
      what: "Files are created in the folder exports/ of the project. The project itself is not changed. If a target file is open in Excel it is saved under a new name."
      how: "1. Choose what is exported (records, screening results or PRISMA numbers). 2. Choose format and scope. 3. Export and download. Files created earlier are listed below."
      result: "A file. You can upload the file \"Screening results\" again on the page \"Evaluation\" and evaluate it with charts."
    results:
      goal: "Evaluate the results with charts: distribution of the decisions, comparison of sources, trend over time, abstract length, quality and cost of the run."
      what: "The page reads the results of a run of your project or a previously exported results file (CSV or Excel). Nothing is changed and nothing is sent."
      how: "Choose the source: \"Run of the project\" or \"Upload exported file\". The sections can be folded; the filterable table is at the bottom."
      result: "Charts and tables you can look at or take over into reports."
    settings:
      goal: "Change all settings of the project in one place."
      what: "Changes are checked and saved in project.overrides.yaml; the project file stays unchanged. \"Reset\" undoes all changes."
      how: "Open a section, change the value and save. Hover over the \"?\" next to a field to see an explanation with an example."
      result: "The new values apply immediately to check and screening."
    help:
      goal: "Look things up: privacy, meaning of the error codes and the log of the project."
      what: "The log contains no keys and no abstracts."
      how: "For an error message find the code in the table; download the log for a bug report."
      result: "You know what an error means and what to do."
