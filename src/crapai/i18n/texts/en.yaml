    run_confirm: "Required before the start: titles and abstracts are sent to the configured provider and may cost money."
    run_start: "Starts the run in its own process. You can close the page afterwards; the run keeps working. The consent box must be ticked first."
    run_pause: "Stops the run as soon as the running requests are done. It can be resumed afterwards."
    run_stop: "Ends the run in a controlled way. What is done stays saved; \"Resume\" continues later."
    run_refresh: "Reloads the state of the run."
    flow_mode: "How duplicates are counted in the flow diagram: all before screening, or only those between different databases."
    export_what: "What is exported: the table of records or the numbers of the PRISMA flow."
    export_scope: "Which records: all, only those going to the model, or only the excluded ones."
    export_delimiter: "Separator of the CSV file. Excel in German-speaking regions usually expects the semicolon."
    export_button: "Creates the file in the folder exports/ of the project."
    export_download: "Saves the created file on your computer."
    refresh_log: "Reads the log of the project again."
    download_log: "Saves the log as a text file, for example for a bug report. It contains no keys and no abstracts."
    reset_settings: "Undoes all changes made here. The values of the project file apply again."
    save_settings: "Checks the entries and saves only the changes in project.overrides.yaml. The project file stays unchanged."
    setting:
      dedup_strategy: "What duplicates are recognised by. \"doi_or_title\": same DOI or same title (recommended); \"strict_ids\": only same DOI/PMID; \"title\": title only; \"title_authors\": title and authors."
      dedup_min_title_words: "Very short titles (for example \"Editorial\") would often be false matches. Example: 4 means a title with fewer than 4 words never counts as a duplicate by title alone."
      dedup_fuzzy_enabled: "Also finds titles with small differences (typos, punctuation, capitalisation). For matches, year, DOI and author are checked in addition."
      dedup_fuzzy_threshold: "How similar two titles must be at least. 1 = identical, 0.94 is a careful value. Higher = fewer but safer matches."
      dedup_fuzzy_max_year_difference: "Equal titles with publication years further apart are not duplicates. Example: 1 allows 2019 and 2020 (online and print year)."
      dedup_fuzzy_require_author_agreement: "If set, the first authors must match too. Safer, but finds fewer."
      dedup_reporting_mode: "How duplicates appear in the PRISMA diagram: all removed before screening, or only those between databases."
      prefilters_language_allow: "Languages that are assessed, as language codes separated by commas. Example: eng, ger. Empty means no restriction."
      prefilters_exclude_retracted: "Exclude retracted publications before screening. They stay visible in the table."
      prefilters_keywords_include_any: "A record is excluded unless at least one of these terms appears in title, abstract or keywords. Comma separated. Empty means no requirement."
      prefilters_keywords_exclude_any: "A record is excluded if any of these terms appears in title, abstract or keywords. Comma separated. Empty means no filter. Runs before the model, without cost."
      quality_short_abstract_words: "An abstract with fewer words gets the hint \"short\" (a hint, not an exclusion). 40 words are about three sentences."
      quality_long_word_letters: "A single word with more letters looks glued together (export error). 40 is generous even for German words."
      quality_garbled_mean_word_letters: "If the mean word length is above this the text looks broken (for example without spaces). Normal text has about 5 to 7."
      quality_min_words_for_mean: "The mean word length is judged only from this many words; shorter texts vary too much."
      quality_short_abstract_chars_unspaced: "Like \"short\" but in characters, for scripts without spaces (Chinese, Japanese, Korean, Thai)."
      preflight_min_abstract_ratio: "If a source has a smaller share of records with an abstract than this, a warning appears. 0.6 means 60 %."
      screening_include_title_only: "Also assess records without an abstract, from the title only. Less reliable, but nothing drops out."
      screening_include_keywords_in_prompt: "The model additionally sees the record's keywords (not only title and abstract). It does not change which records are excluded on its own; combine with the keyword pre-filter for a hard cut."
      discussion_max_rounds: "'crapai discuss' lets the original models of two or more compared runs reconsider a record they disagreed on, each seeing the others' decision and reasoning. This is how many rounds are tried before applying the tie-break rule. More rounds cost more, with no guarantee of convergence."
      discussion_tie_break: "'majority': the decision most models end on wins (a true tie, for example 1 against 1, still counts as no consensus). 'no_consensus': never pick a winner, even with a clear majority; the record is marked NO_CONSENSUS for you to decide."
      screening_uncertain_policy: "How \"uncertain\" is counted later: as include (nothing is lost), as exclude, or kept separate."
      screening_decision_source: "\"model\": the decision comes from the model; \"rule\": it is derived from the single verdicts."
      screening_reasoning_language: "Language in which the model writes its reasoning (de or en)."
      llm_provider: "Provider of the language model: \"openai_compatible\" for SwissGPT and similar services, \"openai\" for OpenAI, \"mock\" to try things out for free without a network."
      llm_model: "Name of the model at the provider. Example: gpt-4o-mini. With \"mock\" the name selects the test scenario (S1 to S15)."
      llm_base_url: "Address of the service, only for \"openai_compatible\". Example: https://api.prod.alpineai.ch/v1"
      llm_api_key_env: "NAME of the environment variable that holds the key, for example SWISSGPT_API_KEY. The key itself is never entered here."
      llm_temperature: "Randomness of the answers. 0 = as consistent as possible (recommended for screening)."
      llm_context_tokens: "Size of the model's context window in tokens, if known. Longer records are then not sent. Empty = unknown."
      llm_max_output_tokens: "Longest length of an answer. If exceeded the answer is cut off and repeated once with double the limit."
      llm_expected_output_tokens: "Usual answer length, only for the cost estimate. The real limit is \"longest length\"."
      llm_timeout_s: "How long to wait for an answer before it counts as an error (seconds)."
      run_batch_size: "Number of records per batch. After each batch it is checked that everything is saved. Example: 1000."
      run_max_batch_error_rate: "Pauses the run if more than this share of a batch failed. 0.5 = half."
      run_max_consecutive_errors: "Pauses the run after this many errors in a row (usually the service is down). 0 = off."
      run_retry_failed_on_resume: "When resuming, also try the failed records again."
      run_checkpoint_seconds: "How often the intermediate state is saved during a batch (seconds)."
      run_stop_grace_seconds: "After \"Pause\" or \"Stop\" running requests may finish for this long (seconds)."
      run_sample_seed: "Random number for the trial run. The same number always draws the same records."
      run_retry_base_delay_s: "Wait before the first repeat of a failed request; it doubles each time (seconds)."
      run_retry_max_delay_s: "Longest single wait between two repeats (seconds)."
      run_max_retry_time_s: "Longest total wait on \"too many requests\" before the record counts as failed (seconds)."
      limits_max_concurrency: "How many requests run at the same time. More is faster, but the provider may slow you down. Usual: 5."
      limits_rpm: "Requests per minute the provider allows. The program keeps to this limit itself."
      limits_tpm: "Tokens per minute the provider allows. The program keeps to this limit itself."
      limits_max_retries: "How often a request is repeated after a server error or lost connection."
      limits_max_parse_retries: "How often the model is asked again when its answer was invalid."
      limits_max_cost: "The run pauses before this sum is exceeded. Empty = no limit. Example: 10"
      limits_currency: "Currency of the price list and the cost figures, three letters. Example: CHF"
      limits_seconds_per_request: "Assumed duration of one request, only for the time estimate."
      limits_cost_uncertainty: "Half width of the cost band in the estimate. 0.15 means plus/minus 15 %."
