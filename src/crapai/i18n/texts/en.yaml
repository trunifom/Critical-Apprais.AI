# Error texts: what happened - why - what to do (plan chapter 26.4, ADR 0012). Codes follow the catalogue.
errors:
  E101:
    title: "The file type is not supported or not recognised."
    cause: "The content is neither RIS, NBIB, BibTeX nor a table, or the file type is not part of version 1."
    action: "Export the search results again as RIS, NBIB, BibTeX, CSV or XLSX."
  E102:
    title: "No records were found in the file."
    cause: "The file is empty or is not the export you meant."
    action: "Check that the export is not empty and export it again."
  E103:
    title: "The file could not be read with this text encoding."
    cause: "The file uses a text encoding the program did not expect."
    action: "Try another encoding, for example --encoding cp1252."
  E104:
    title: "A column could not be assigned."
    cause: "The column names of the table differ from the usual names."
    action: "Name the column yourself, for example --map abstract=<column>."
  E105:
    title: "The ZIP file contains no readable PDFs."
    cause: "PDF import is not part of version 1."
    action: "Import a bibliographic export instead."
  E106:
    title: "This file has already been imported."
    cause: "A file with identical content is listed in the import log."
    action: "Use --force to import it again; the records will then exist twice."
  E201:
    title: "A required setting is missing in project.yaml."
    cause: "The project file is incomplete, for example without inclusion criteria."
    action: "Add the missing setting to project.yaml."
  E202:
    title: "The model is not known."
    cause: "The model name is not in the model catalogue."
    action: "Check the model name or extend models.yaml."
  E203:
    title: "A setting has an invalid value."
    cause: "A value is outside the allowed range or a setting name is misspelled."
    action: "Correct the listed settings."
  E301:
    title: "The API key is missing or invalid."
    cause: "The environment variable with the key is not set, or the provider rejected the key."
    action: "Set the environment variable named in project.yaml and try again."
  E302:
    title: "The provider's rate limit was exceeded."
    cause: "Too many calls per minute."
    action: "The program slows down automatically. Lower the number of parallel calls if it happens often."
  E303:
    title: "The input is too long for the model."
    cause: "Title and abstract together exceed the model's context window."
    action: "Choose a model with a larger context window."
  E304:
    title: "The model's answer was unusable."
    cause: "The answer did not follow the required format."
    action: "The call is repeated. If it happens often, choose another model. Unusable answers are never counted as a decision."
  E305:
    title: "The provider could not be reached."
    cause: "Network or proxy problem, or a temporary error at the provider."
    action: "Check the connection and resume the run."
  E306:
    title: "The provider refused the content."
    cause: "A safety filter of the provider blocked this record."
    action: "Assess this record by hand."
  E307:
    title: "The provider's credit or quota is used up."
    cause: "The account has no more balance for calls."
    action: "Check the account and resume the run afterwards."
  E401:
    title: "A file could not be written."
    cause: "The file is open in another program, or the folder is not writable."
    action: "Close the file in other programs and check the folder permissions."
  E402:
    title: "The project is in use by another process."
    cause: "A lock file of a running process exists."
    action: "Finish the other run first. If none is running, the lock is stale: remove it with 'crapai unlock <folder>'."
  E403:
    title: "There is not enough disk space."
    cause: "The drive is full."
    action: "Free some disk space and resume."
  E404:
    title: "The folder is not a project of this version, or a project file is damaged."
    cause: "The version marker or a project file is missing or does not match."
    action: "Select the correct folder, restore data/.backup or run the migration."
  E405:
    title: "The folder is already a project, or it is not empty."
    cause: "A new project needs a new or empty folder; this one already holds a project or other files."
    action: "Open the existing project, or choose a new or empty folder."
  E501:
    title: "Too few common records for the statistics."
    cause: "The runs do not overlap enough."
    action: "Check that the runs belong to the same data."
  E502:
    title: "The human decisions could not be matched."
    cause: "The key column does not match the project's records."
    action: "Try another key, for example --match doi."
  E999:
    title: "An unexpected error occurred."
    cause: "This is a program error."
    action: "See the log file .crapai/app.log and report the problem."

