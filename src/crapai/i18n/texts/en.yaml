# PORTED from SARA-App texts/en.yaml (email templates removed: the product sends no e-mail).
# Adapted for Critical Apprais.AI (task T-M1-12): full text is not part of version 1, no background
# worker and no e-mail. New sections at the end: nav, common, start, data, run, results, prisma,
# evaluation, settings, help, errors. Keep de.yaml in sync (tests/unit/test_i18n_parity.py).
# texts/en.yaml
# Complete English i18n for review_setup page (project setup + criteria + upload + preflight + estimate + start)
# All strings are UI-facing and may contain Markdown.

sections:
  page:
    title: "Automated Literature Review — Setup"
    subtitle: "Provide project info, define screening criteria, upload your sources, and start the background review."

  project:
    header: "1️⃣ Project Information"
    fields:
      title:
        label: "Project Title"
        placeholder: "e.g. Systematic review of neurofeedback in children with ADHD"
        help: |
          **ℹ️ Project Title**
          Give your review a concise and unique name.  
          This will be used across logs and exported reports.
      description:
        label: "Project Description (optional)"
        placeholder: "Briefly describe the aim, scope and context of this review…"
        help: |
          **ℹ️ Project Description**
          Optionally add a short description of the study design, aims and scope.  
          This metadata will be stored with your project and included in logs/exports.

  screening:
    header: "2️⃣ Define Screening Criteria"

    review_mode:
      label: "Select Review Mode"
      options: ["Abstract"]
      help: |
        **ℹ️ Review Mode**
        Version 1 screens **titles and abstracts**. Full-text screening is not available yet.

    objectives:
      count_label: "Number of objectives"
      count_help: |
        **ℹ️ Research Objectives**
        How many objectives guide the screening?  
        Enter a value between **1** and **10**.  
        Each objective can be a short sentence (comma-separated sub-points are fine).
      list_header: "Objectives"
      item_label: "Objective {index}"

    framework:
      label: "Choose framework"
      options: ["PICOS", "SPIDER", "PECO", "PIRD", "CUSTOM"]
      help: |
        **ℹ️ Framework Selection**
        Pick a standard framework to structure your inclusion/exclusion criteria, or select **CUSTOM** to define your own fields.

        **Available Frameworks**  
        - **PICOS**: *Population*, *Intervention*, *Comparison*, *Outcome*, *Study Design*  
        - **SPIDER**: *Sample*, *Phenomenon of Interest*, *Design*, *Evaluation*, *Research Type*  
        - **PECO**: *Population*, *Exposure*, *Comparison*, *Outcome*  
        - **PIRD**: *Population*, *Index Test*, *Reference Standard*, *Diagnosis*  
        - **CUSTOM**: Define your own fields for inclusion and exclusion

    frameworks_info: |
      **📚 Frameworks Available**  
      - **PICOS**: Population, Intervention, Comparison, Outcome, Study Design  
      - **SPIDER**: Sample, Phenomenon of Interest, Design, Evaluation, Research Type  
      - **PECO**: Population, Exposure, Comparison, Outcome  
      - **PIRD**: Population, Index Test, Reference Standard, Diagnosis  
      - **CUSTOM**: Define your own inclusion/exclusion fields  

    custom_criteria:
      subheader: "🔧 Custom Criteria Builder"
      field_name_label: "Enter custom field name"
      add_button: "Add Field"
      remove_button: "Remove"

    inclusion_exclusion:
      subheader: "Inclusion & Exclusion Criteria"
      inclusion_label: "Inclusion — {field}"
      exclusion_label: "Exclusion — {field}"

  upload:
    # New nested keys for mode-specific copy (kept alongside existing keys for compatibility)
    abstract:
      header: "3️⃣ Upload & Label Source Files"
      instructions: |
        Upload one or more bibliographic export files.  
        Supported formats: **.ris**, **.bib**, **.nbib** (PubMed/MEDLINE), **.csv** and **.xlsx**.  

        For each uploaded file, provide the **database/source name** (e.g., *PubMed*, *MEDLINE*, *Embase*, *CINAHL*).  
        This label will appear in your logs and help you recognize each dataset later.
      file_type:
        label: "Select file type"
        options: [".ris", ".bib", ".nbib", ".csv", ".xlsx"]
      file_uploader:
        label: "Choose files"
      database_names_header: "**Database/source label for each uploaded file:**"
      database_field:
        label: "Enter the **database/source name** for `{filename}`"
        placeholder: "e.g. PubMed, MEDLINE, Embase, CINAHL"
        help: |
          **ℹ️ Database/Source Label**
          Type the name of the scientific database or export source the file was downloaded from.
          This is free text; examples include:
          - *PubMed*
          - *MEDLINE*
          - *Embase*
          - *CINAHL*
          - *Cochrane Library*
          - *PsycINFO*
          - *ERIC*
          - *Scopus*
          - *Web of Science*
          - *Google Scholar*

  start:
    confirm_label: "I confirm that the project data, criteria and uploads are correct. Start the background review."
    button_label: "🚀 Start Review"
    total_records_preview: "**Total records: {count}. Preview:**"

preflight:
  header: "Preflight Checks"
  table:
    headers:
      filename: "Filename"
      label: "Label"
      records: "Records"
      with_abstract: "With Abstract"
      status: "Status"
  status:
    ok: "OK — file parsed successfully"
    warn_low_abstracts: "Warning — low abstract coverage: records without an abstract are not screened but stay visible"
    error_unparseable: "Error — file could not be parsed"
    error_no_records: "Error — file contains no records"
    error_no_abstracts: "Error — no abstracts found for Abstract mode"
  note: |
    *Note:* These checks inform you before a run.  
    The official PRISMA numbers are recorded in the run itself.

estimate:
  header: "Estimated Tokens & Cost (Preview)"
  input_tokens: "Input tokens"
  output_tokens: "Output tokens"
  total_tokens: "Total tokens"
  cost_range: "Estimated cost range"
  note: |
    *Important:* These are **estimates** for planning and transparency.  
    Actual token usage and costs depend on the model and the final prompts.  
    The run reports the actual usage.

# (Removed duplicate top-level 'sections' block; 'start' already lives under sections above)

notifications:
  parse_error: "Error parsing `{filename}`: {error}"
  review_started: "✅ Run started. Run ID: {file_id}"
  log_failed: "The run could not be recorded: {error}"
  background_info: |
    Your review is running and may take some time depending on the provider's limits.  
    Results are written to the project folder; no e-mail is sent.  
    Submitted items: **{total}**.

# ---- Command line (task T-M1-11). Added for Critical Apprais.AI; keep in sync with de.yaml. ----
cli:
  init:
    done: "Project created: {path}"
    next: "Next: edit project.yaml (at least one inclusion criterion), then import your files."
    example: "Example: {command} import {path} <file> --label <name>"
    sync_warning: "Warning: the folder is inside a synchronised location ({marker}). Sync clients touch files while they are written. Run screening in a non-synchronised folder and archive it afterwards."
  export:
    done: "Exported {records} record(s) (scope: {scope}) as {format}: {path}"
    done_flow: "PRISMA flow numbers written: {path}"
    alternative: "The file {wanted} is open in another program, so nothing was overwritten. The export was saved under the name shown above; close the program and export again if you need the original name."
  ui:
    starting: "Starting the interface at http://127.0.0.1:{port} (stop it with Ctrl+C). It runs on this computer only."
  unlock:
    none: "There is no lock: the project is not in use."
    in_use: "The project is in use by a running process (PID {pid}). Nothing was changed."
    not_stale: "The lock is recent and cannot be removed yet (it counts as stale after 60 seconds without a sign of life from a stopped process). Nothing was changed."
    confirm: "The lock of PID {pid} is stale: its process is no longer running. Remove it?"
    declined: "Nothing was changed. Add --yes to remove a stale lock without asking."
    removed: "Stale lock removed. The project can be used again."
  import:
    done: "Imported {records} record(s) from {file} as \"{label}\": {abstracts} with abstract. The project now holds {total} record(s)."
    format: "Format: {format} ({reason})"
    encoding: "Text encoding: {encoding}"
    mapping: "Columns used: {mapping}"
    mapping_project: "Columns used (import.mappings in project.yaml): {mapping}"
    note: "Note: {note}"
  warning:
    no_abstracts: "Warning: none of these records has an abstract. Screening needs abstracts (or the title-only option)."
    low_abstract_ratio: "Warning: fewer than 60 % of these records have an abstract."
    empty_records: "Warning: {count} record(s) have neither title nor abstract and are marked EMPTY_RECORD."
    events_not_written: "Warning: the PRISMA event file (data/events.jsonl) could not be written. The records are saved; run 'crapai check' again later to rebuild the event."
  check:
    status:
      ok: "Preflight: OK. The project is ready for screening."
      warning: "Preflight: WARNING. Screening is possible, but please read the notes below."
      error: "Preflight: ERROR. Nothing can be screened yet."
    totals: "Records: {records}, duplicates: {duplicates}, going to the model: {valid}"
    sources: "Sources:"
    source_line: "  {label}: {records} records, {abstracts} with abstract ({percent} %), {duplicates} duplicates, {valid} going to the model"
    reasons: "Records that do not go to the model (they stay in the table):"
    reason_line: "  {reason}: {count} ({meaning})"
    reason:
      DUPLICATE: "duplicate of another record"
      EMPTY_RECORD: "neither title nor abstract"
      IMPORT_ERROR: "could not be read"
      NOT_SCREENABLE: "front or back matter, not a study"
      RETRACTED: "retracted publication"
      NO_ABSTRACT: "no abstract"
      PREFILTER_LANGUAGE: "language not allowed by the pre-filter"
      PREFILTER_YEAR: "year outside the pre-filter range"
      PREFILTER_TYPE: "publication type excluded by the pre-filter"
      NO_TEXT: "no text"
      ENCRYPTED: "encrypted file"
    quality: "Abstract quality: ok {ok}, short {short}, suspect {suspect}"
    issue:
      no_records: "There are no records yet. Import files first."
      nothing_to_screen: "No record can go to the model. Records without an abstract are not screened; check the sources or allow title-only screening (screening.include_title_only)."
      low_abstract_ratio: "Fewer than 60 % of the records of some sources have an abstract. Records without an abstract are not screened but stay visible."
      suspect_abstracts: "{suspect} abstract(s) look garbled or glued together. Please check them."
      retracted_included: "{retracted} retracted publication(s) stay in the run. Set prefilters.exclude_retracted to exclude them."
      events_not_written: "The PRISMA event file (data/events.jsonl) could not be written, so the flow numbers have a gap. The records are saved; run the check again once the file is free."
      config_invalid: "project.yaml needs attention: {problem}"
    updated: "Duplicates and validity were recalculated just now."
    read_only: "Read only: duplicates and validity were not recalculated."
    cost:
      model: "Model: {provider} / {model}"
      tokens: "Tokens: input about {input}, output about {output} ({kind})"
      exact: "counted exactly"
      approximate: "approximate, with a 10 % safety margin"
      cost: "Cost: about {low} to {high} {currency} (worst case {worst} {currency}; prices valid from {valid})"
      no_price: "Cost: no price for this model. Add it to pricing.csv in the project folder."
      duration: "Duration: about {duration} (limited by {limit})"
      limit:
        rpm: "requests per minute"
        tpm: "tokens per minute"
        latency: "the time a request takes"
        none: "nothing to send"
      over_limit: "The worst case is above limits.max_cost ({max_cost}); the run would stop early."
      error: "The cost estimate is not available: {problem}"
  dedup:
    done: "Duplicates marked: {marked} of {records} records in {groups} group(s). Strategy: {strategy} ({source}). Nothing was deleted."
    none: "No duplicates found with strategy {strategy} ({source})."
    methods: "By reason: {methods}"
    sources: "Within one source: {within}. Across sources: {across}."
    source:
      cli: "command line"
      project: "project.yaml"
      default: "default"
  status:
    title: "Project: {title}"
    folder: "Folder: {path}"
    records: "Records: {records} (with abstract: {abstracts}, empty: {empty}, duplicates: {duplicates})"
    sources: "Sources:"
    source_line: "  {label}: {count}"
    no_records: "No records yet. Import files with: {command} import <folder> <file> --label <name>"
    config_ok: "Configuration: OK"
    config_problem: "Configuration needs attention: {problem}"
    in_use: "The project is in use by another process."
  error:
    prefix: "Error {code}"
    cause: "Why"
    details: "Details"
    action: "What to do"
    unexpected: "An unexpected error occurred. Details are in the log file .crapai/app.log."

