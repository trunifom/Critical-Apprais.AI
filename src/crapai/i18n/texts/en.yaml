start:
  title: "Critical Apprais.AI"
  tagline: "Screening assistant for systematic reviews – runs locally on your computer"
  purpose: |
    Critical Apprais.AI helps with the **title and abstract screening** of a systematic review.
    It reads your literature exports, sends each record with your inclusion and exclusion criteria to a
    language model and records a **proposal** (include, exclude or uncertain) with a short justification per criterion.
  how_it_works:
    header: "How it works"
    step1: "Describe your review and your criteria."
    step2: "Import your search results (RIS, NBIB, BibTeX, CSV, XLSX)."
    step3: "Check the estimate, run a small trial and start the run."
    step4: "Review the proposals in the results table and export them."
  limits:
    header: "Limits"
    text: |
      The tool **does not replace people**. It proposes; you decide. Version 1 works on titles and abstracts only.
      Records without an abstract are not screened by the model but stay visible in the table.
      Only the calls to the model provider leave your computer; all files stay in the project folder.
