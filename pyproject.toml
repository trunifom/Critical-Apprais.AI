[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crapai"
version = "0.0.1"
description = "Critical Apprais.AI: local, database-free LLM screening assistant for systematic reviews"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"  # source available, no commercial use (docs/adr/0016)
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
crapai = "crapai.cli:main"  # needs the "cli" extra

[project.optional-dependencies]
# Extras are introduced by the task cards (see tasks/). Listed here so agents know the plan.
import = ["rispy", "pybtex", "openpyxl", "pymupdf", "pdfplumber", "pylatexenc"]
llm-openai = ["openai", "tiktoken"]
llm-anthropic = ["anthropic"]
cli = ["typer", "rich"]
ui = ["streamlit", "streamlit-aggrid"]
stats = ["scikit-learn", "matplotlib"]
dev = ["pytest", "pytest-asyncio", "hypothesis", "respx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/crapai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: talks to a real LLM API (costs money; never run in CI)",
    "large: uses files from tests/data_large (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# reference/ is a read-only snapshot of the predecessor (AGENTS.md): never lint-fix or edit it.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Files ported verbatim from SARA-App keep their original style until a task refactors them.
[tool.ruff.lint.per-file-ignores]
"scripts/generate_task_cards.py" = ["E501"]  # generator holds long card texts
"scripts/plan_chapter.py" = ["SIM114"]
"src/crapai/enums.py" = ["E501", "UP", "I"]
"src/crapai/cost/estimator.py" = ["E501", "UP", "I", "SIM", "F401"]
"src/crapai/criteria/template.py" = ["E501", "UP", "I", "SIM"]
"src/crapai/i18n/**" = ["E501", "UP", "I", "SIM", "B", "F401", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
