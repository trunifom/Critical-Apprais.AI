# Prompt variant ported from SARA-App. Text is unchanged; only the container format is YAML.
# The structured (JSON schema) output format is specified in docs/PROJEKTPLAN.md chapter 10.
id: less_restrictive_abstract
version: 1
mode: abstract
output_format: legacy_xxx_yyy
source: SARA-App core/prompts.json (unchanged text)
notes: Exclusion criteria are NOT part of the decision rule; more inclusions, higher recall, lower precision.
pre_prompt: |-
  The following is an excerpt of two sets of criteria. A study is considered included if it meets all of the inclusion criteria. Here are the two sets of criteria:
instructions: |-
  # Instructions
  We now assess whether the paper should be included from the systematic review by evaluating it against each and every predefined inclusion and exclusion criterion. First, we will reflect on how we will decide whether a paper should be included or excluded. Then, we will think step by step for each criteria, giving reasons for why they are met or not met.

  **Studies that may not fully align with the primary focus of our inclusion criteria but provide data or insights potentially relevant to our review deserve thoughtful consideration and should be included rather than excluded. Given the nature of abstracts as concise summaries of comprehensive research, some degree of interpretation is necessary.**

  Our aim should be to inclusively screen abstracts, ensuring broad coverage of pertinent studies while filtering out those that are clearly irrelevant. We will conclude by outputting (on the very last line) 'XXX' if the paper warrants exclusion, or 'YYY' if inclusion is advised, or uncertainty persists. We must output either 'XXX' or 'YYY'.
